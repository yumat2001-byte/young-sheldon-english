ointed to his chest.","j":"彼は自分の胸を指した。","forms":[]},{"w":"breath","p":"/breθ/","m":"息","d":"息","learn":[],"u":["catch your breath","息を整える"],"e":"Give me a minute to catch my breath.","j":"息を整えるから少し待って。","forms":[]},{"w":"asleep","p":"/əˈsliːp/","m":"眠っている","d":"眠っている","learn":[],"u":["fall asleep","眠りにつく"],"e":"The kids are already asleep.","j":"子どもたちはもう寝てるよ。","forms":[]},{"w":"concentrate","p":"/ˈkɑːnsənˌtreɪt/","m":"集中する","d":"集中する","learn":[],"u":["concentrate on the task","目の前の課題に集中する"],"e":"I concentrate better in a quiet room.","j":"静かな部屋のほうが集中できる。","forms":[]},{"w":"overnight","p":"/ˌoʊvərˈnaɪt/","m":"一晩中・一泊で","d":"一晩中・一泊で","learn":[],"u":["stay overnight","一泊する"],"e":"Is it okay if I stay overnight?","j":"一晩泊まってもいい？","forms":[]},{"w":"ambulance","p":"/ˈæmbjələns/","m":"救急車","d":"救急車","learn":[],"u":["call an ambulance","救急車を呼ぶ"],"e":"The ambulance is outside the main entrance.","j":"救急車は正面入り口の外にいる。","forms":[]},{"w":"obvious","p":"/ˈɑːbviəs/","m":"明らかな","d":"明らかな","learn":[],"u":["an obvious difference","明らかな違い"],"e":"The answer wasn't obvious to me.","j":"私には答えがすぐにはわからなかった。","forms":[]},{"w":"fold","p":"/foʊld/","m":"カードの勝負を降りる","d":"カードの勝負を降りる","learn":[],"u":["fold your hand","カードゲームで勝負を降りる"],"e":"I think I should fold this time.","j":"今回は勝負を降りたほうがよさそうだ。","forms":[]},{"w":"bluff","p":"/blʌf/","m":"はったりをかける","d":"はったりをかける","learn":[["語形","bluffed","この回で使われた形"],["語形","bluffing","この回で使われた形"]],"u":["try to bluff","はったりをかけてみる"],"e":"It's hard to bluff when you keep smiling.","j":"ずっと笑っていたら、はったりをかけるのは難しいよ。","forms":["bluffed","bluffing"]},{"w":"quarter","p":"/ˈkwɔːrtər/","m":"25セント硬貨","d":"25セント硬貨","learn":[],"u":["a shiny quarter","ぴかぴかの25セント硬貨"],"e":"Do you have a quarter for the machine?","j":"機械に入れる25セント硬貨を持ってる？","forms":[]},{"w":"nickel","p":"/ˈnɪkəl/","m":"5セント硬貨","d":"5セント硬貨","learn":[],"u":["one nickel","5セント硬貨1枚"],"e":"I found a nickel under the table.","j":"机の下で5セント硬貨を見つけた。","forms":[]},{"w":"faith","p":"/feɪθ/","m":"信じる気持ち・信仰","d":"信じる気持ち・信仰","learn" ')state.mastery[w]=n==='ほぼ覚えた'?'覚えた':'ほぼ覚えた';state.wrong=state.wrong.filter(v=>v!==w);syncUnlock()}function speakText(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.96;speechSynthesis.speak(u)}function relatedHTML(x){return x.learn.map(a=>'<div class="learn-row"><span class="tag" data-tag="'+a[0]+'">'+a[0]+'</span><b class="speakable" onclick="speakText(\''+a[1].replace(/'/g,"\\'")+'\')">'+a[1]+'</b>　'+a[2]+'</div>').join('')+'<div class="usage speakable" onclick="speakText(\''+x.u[0].replace(/'/g,"\\'")+'\')"><b>'+x.u[0]+'</b><span>'+x.u[1]+'</span></div>'}function setRing(chunk){let colors={'苦手':'#D79A91','うろ覚え':'#D6BC72','ほぼ覚えた':'#8FA3B8','覚えた':'#86B99A','未学習':'#D1D5DB'},order=['覚えた','ほぼ覚えた','うろ覚え','苦手','未学習'],total=chunk.length,start=0,parts=[];order.forEach(l=>{let n=chunk.filter(x=>masteryOf(x.w)===l).length;if(!n)return;let end=start+n/total*360;parts.push(colors[l]+' '+start+'deg '+end+'deg');start=end});return 'conic-gradient('+parts.join(',')+')'}function openEpisode(){syncUnlock();let sets=Math.ceil(words.length/SET_SIZE),m=words.filter(mastered).length;epWordCount.textContent=words.length+' words';epProgress.style.width=(m/words.length*100)+'%';epProgressText.textContent=m+' / '+words.length+'語 習得';let html='';for(let i=1;i<=sets;i++){let chunk=words.slice((i-1)*SET_SIZE,i*SET_SIZE),done=chunk.filter(mastered).length,ring=setRing(chunk);html+='<div class="set-row" onclick="startSet('+i+')"><div class="set-num" style="background:'+ring+'"><span>'+i+'</span></div><div class="set-info"><b>SET '+i+'</b><span>'+done+' / '+chunk.length+'語 習得</span></div><div class="set-state">'+(done===chunk.length?'✓':'›')+'</div></div>'}setList.innerHTML=html;show('episode')}function currentSetNo(){for(let i=1;i<=Math.ceil(words.length/SET_SIZE);i++){let c=words.slice((i-1)*SET_SIZE,i*SET_SIZE);if(c.some(x=>!mastered(x)))return i}return Math.ceil(words.length/SET_SIZE)}function startCurrentSet(){beginSetStudy(currentSetNo())}function beginSetStudy(n){studyWords=words.slice((n-1)*SET_SIZE,n*SET_SIZE);idx=0;studyMode='set';show('learn');renderWord();speakText(studyWords[0].w)}function startSet(n){beginSetStudy(n)}function todayWords(){syncUnlock();let available=words.slice(0,state.unlockedSet*SET_SIZE),priority={'苦手':0,'うろ覚え':1,'未学習':2,'ほぼ覚えた':3,'覚えた':4},sorted=[...available].sort((a,b)=>priority[masteryOf(a.w)]-priority[masteryOf(b.w)]);return sorted.slice(0,Math.min(10,sorted.length))}function startToday(){studyWords=todayWords();idx=0;studyMode='today';show('learn');renderWord();speakText(studyWords[0].w)}function startWrongRetest(){let retry=words.filter(x=>currentWrong.includes(x.w));if(!retry.length){alert('今回のテストで間違えた単語はありません');return}startQuiz(retry,'retest')}function currentLearnWord(){return studyWords[idx]}function renderWord(){let x=currentLearnWord();counter.textContent=(idx+1)+' / '+studyWords.length;word.textContent=x.w;pron.textContent=x.p;meaning.textContent=x.m;learnRelated.innerHTML=relatedHTML(x);example.innerHTML='<div class="small">学習用例文（オリジナル）</div><div class="example-text">'+x.e+'</div><div class="example-ja">'+x.j+'</div>';renderLearnMastery();if(!state.learned.includes(x.w))state.learned.push(x.w);save();nextBtn.textContent=idx===studyWords.length-1?(studyMode==='set'?'SETテストへ':studyMode==='single'?'一覧へ':'学習を終える'):'次へ'}function renderLearnMastery(){let x=currentLearnWord(),ls=['苦手','うろ覚え','ほぼ覚えた','覚えた'],now=masteryOf(x.w);learnMastery.textContent=now;learnMastery.dataset.level=now;learnMasteryButtons.innerHTML=ls.map(l=>'<button class="'+(l===now?'active':'')+'" onclick="setLearn(\''+l+'\')">'+l+'</button>').join('')}function setLearn(l){setMasteryWord(currentLearnWord().w,l);renderLearnMastery()}function nextWord(){if(idx<studyWords.length-1){idx++;renderWord();speakText(studyWords[idx].w);window.scrollTo(0,0)}else if(studyMode==='single'){showList()}else if(studyMode==='set'){startQuiz(studyWords)}else openEpisode()}function showList(){listCount.textContent=words.length+' words';wordList.innerHTML=words.map((x,i)=>'<div class="list-item" onclick="studySingleWord('+i+')"><div class="row"><span class="list-word">'+x.w+'</span><span class="mastery" data-level="'+masteryOf(x.w)+'">'+masteryOf(x.w)+'</span></div><div class="list-meaning">'+x.m+'　'+x.p+'</div></div>').join('');show('list')}function studySingleWord(i){studyWords=[words[i]];idx=0;studyMode='single';show('learn');renderWord();speakText(words[i].w)}function exitStudy(){studyMode==='single'?showList():openEpisode()}function renderCountChoices(){countChoices.innerHTML=[10,20,30,40].map(n=>'<button class="'+(state.quizCount===n?'active':'')+'" onclick="setCount('+n+')">'+n+'問</button>').join('')}function setCount(n){state.quizCount=n;save();renderCountChoices()}function quizPool(){syncUnlock();let learned=words.filter(x=>state.learned.includes(x.w)||masteryOf(x.w)!=='未学習');return learned.length>=4?learned:words.slice(0,state.unlockedSet*SET_SIZE)}function buildQuiz(){let base=quizPool(),pool=[...base].sort((a,b)=>rank(a.w)-rank(b.w)),out=[];while(out.length<state.quizCount){out.push(...pool);pool=[...base].sort(()=>Math.random()-.5)}return out.slice(0,state.quizCount)}function startQuiz(custom,mode){quizMode=mode||'normal';quizWords=custom?[...custom]:buildQuiz();qidx=0;score=0;currentWrong=[];questionAnswered=false;show('quiz');renderQuiz()}function renderQuiz(){questionAnswered=false;let x=quizWords[qidx];quizCount.textContent=(qidx+1)+' / '+quizWords.length;quizWord.textContent=x.w;answerNote.className='answer-note hidden';feedback.classList.add('hidden');quizNext.classList.add('hidden');let pool=[x];while(pool.length<4){let w=words[Math.floor(Math.random()*words.length)];if(w.w!==x.w&&!pool.some(o=>o.m===w.m))pool.push(w)}pool.sort(()=>Math.random()-.5);options.innerHTML='';pool.forEach(w=>{let b=document.createElement('button');b.className='option';b.textContent=w.m;b.onclick=()=>answer(b,w,x);options.appendChild(b)})}function showOptionExplanation(w,kind){if(!w)return;answerNote.className='answer-note '+kind;answerNote.innerHTML='<b class="speakable" onclick="speakText(&quot;'+w.w.replace(/&/g,'&amp;').replace(/\"/g,'&quot;')+'&quot;)">'+w.w+'</b><br>'+w.m+'<div class="quiz-related">'+relatedHTML(w)+'</div>';speakText(w.w)}function answer(btn,choice,x){if(questionAnswered){showOptionExplanation(choice,choice.w===x.w?'correct':'wrong');if(choice.w===x.w){feedback.innerHTML='<div class="small">学習用例文（オリジナル）</div><div class="example-text">'+x.e+'</div><div class="example-ja">'+x.j+'</div>';feedback.classList.remove('hidden')}else feedback.classList.add('hidden');return}if(choice.w!==x.w){if(btn.classList.contains('wrong')){showOptionExplanation(choice,'wrong');return}btn.classList.add('wrong');if(!currentWrong.includes(x.w))currentWrong.push(x.w);setMasteryWord(x.w,'苦手');showOptionExplanation(choice,'wrong');return}questionAnswered=true;if(!currentWrong.includes(x.w))score++;btn.classList.add('correct');if(quizMode==='weak'||(quizMode!=='retest'&&!currentWrong.includes(x.w)))promote(x.w);save();showOptionExplanation(x,'correct');feedback.innerHTML='<div class="small">学習用例文（オリジナル）</div><div class="example-text">'+x.e+'</div><div class="example-ja">'+x.j+'</div>';feedback.classList.remove('hidden');quizNext.classList.remove('hidden')}function nextQuiz(){if(qidx<quizWords.length-1){qidx++;renderQuiz()}else{syncUnlock();save();show('review');renderReviewLists()}}function reviewWordRow(w){let i=words.findIndex(x=>x.w===w.w);return '<div class="list-item" onclick="studySingleWord('+i+')"><div class="list-word speakable" onclick="event.stopPropagation();speakText(\''+w.w.replace(/'/g,"\\'")+'\')">'+w.w+'</div><div class="list-meaning">'+w.m+'</div></div>'}function renderReviewLists(){if(!document.getElementById('reviewWordLists'))return;let wrong=quizWords.filter(x=>currentWrong.includes(x.w)),correct=quizWords.filter(x=>!currentWrong.includes(x.w));reviewWordLists.innerHTML='<div class="detail-label">間違えた単語　'+wrong.length+'語</div>'+(wrong.length?wrong.map(reviewWordRow).join(''):'<p class="small">なし</p>')+(correct.length?'<details class="review-details"><summary>正解した'+correct.length+'語を見る</summary>'+correct.map(reviewWordRow).join('')+'</details>':'')}function updateStats(){syncUnlock();let c=l=>words.filter(x=>masteryOf(x.w)===l).length;knownStat.textContent=c('覚えた');almostStat.textContent=c('ほぼ覚えた');fuzzyStat.textContent=c('うろ覚え');weakStat.textContent=c('苦手');scoreStat.textContent=quizWords.length?Math.round(score/quizWords.length*100)+'%':'0%';wrongCount.textContent=currentWrong.length;if(currentWrong.length){retestWrongBtn.textContent='間違えた'+currentWrong.length+'語をテスト';retestWrongBtn.classList.remove('hidden');reviewBackBtn.classList.add('secondary')}else{retestWrongBtn.classList.add('hidden');reviewBackBtn.classList.remove('secondary')}let t=todayWords(),counts={new:0,weak:0,review:0};t.forEach(x=>{let m=masteryOf(x.w);if(m==='未学習')counts.new++;else if(m==='苦手')counts.weak++;else counts.review++});todayMix.textContent='新規 '+counts.new+' · 苦手 '+counts.weak+' · 復習 '+counts.review;epMeta.textContent=words.length+' words · '+c('覚えた')+' mastered';renderCountChoices()}syncUnlock();updateStats();</script><script src="../smart-tips.js?v=11"></script><script src="../learning-plan.js?v=3.31-2"></script><script src="../episode-catalog.js?v=11"></script><script src="../episode-ui.js?v=12"></script><script src="../speaking/lessons.js"></script><script src="../speaking/practice.js?v=10"></script></body></html>

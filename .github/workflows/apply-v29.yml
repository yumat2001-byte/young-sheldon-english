name: Apply v2.9 mastery fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mastery behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<span class="pill version">v2.8</span>','<span class="pill version">v2.9</span>',1)
          s=s.replace('<span class="pill version">v2.7</span>','<span class="pill version">v2.9</span>',1)
          # Retest mode: correct answers must not promote mastery.
          s=s.replace("let idx=0,qidx=0,score=0,answered=0,studyWords=[],quizWords=[],currentWrong=[],currentCorrect=[],detailIndex=0,studyMode='set';","let idx=0,qidx=0,score=0,answered=0,studyWords=[],quizWords=[],currentWrong=[],currentCorrect=[],detailIndex=0,studyMode='set',quizMode='normal';",1)
          # startQuiz gains mode parameter; normal tests default to normal.
          s=s.replace('function startQuiz(custom){','function startQuiz(custom,mode){quizMode=mode||\'normal\';',1)
          # Retest explicitly uses retest mode.
          s=s.replace('startQuiz(retry)}','startQuiz(retry,\'retest\')}',1)
          # Correct answer promotion rule: normal test only. Promote exactly one level; retest never changes mastery upward.
          old="btn.classList.add('correct');promote(x.w);save();showOptionExplanation"
          new="btn.classList.add('correct');if(quizMode!=='retest')promote(x.w);save();showOptionExplanation"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('correct promotion anchor not found')
          p.write_text(s)
          PY
      - name: Commit v2.9
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Keep retest mastery unchanged and promote normal test answers"
          git push

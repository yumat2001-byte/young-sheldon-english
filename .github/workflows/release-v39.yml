name: Release v3.9 fixed action bars

on:
  push:
    paths:
      - '.github/workflows/release-v39.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix study and quiz bottom action bars
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('smart-tips.js')
          s=p.read_text()
          if "v.textContent='v3.8'" not in s:
              raise SystemExit('smart-tips v3.8 marker missing')
          s=s.replace("v.textContent='v3.8'","v.textContent='v3.9'",1)
          marker='/* v3.9 fixed bottom action bars */'
          if marker not in s:
              s += r'''

/* v3.9 fixed bottom action bars */
(function(){
  const style=document.createElement('style');
  style.textContent='.fixed-action-bar{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));width:min(calc(100% - 32px),688px);padding:7px;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:18px}.fixed-action-bar button{width:100%;margin:0;padding:15px 16px;border-radius:13px}.screen.action-screen{padding-bottom:88px}';
  document.head.appendChild(style);

  function wrapActionButton(btn,id){
    if(!btn)return null;
    let bar=document.getElementById(id);
    if(!bar){
      bar=document.createElement('div');
      bar.id=id;
      bar.className='fixed-action-bar';
      btn.parentNode.insertBefore(bar,btn);
      bar.appendChild(btn);
    }
    btn.classList.remove('fixed-next','quiz-next-inline');
    btn.style.position='';
    btn.style.width='';
    btn.style.minWidth='';
    btn.style.marginTop='';
    btn.style.boxShadow='';
    return bar;
  }

  const learn=document.getElementById('learn');
  const quiz=document.getElementById('quiz');
  if(learn)learn.classList.add('action-screen');
  if(quiz)quiz.classList.add('action-screen');

  wrapActionButton(document.getElementById('nextBtn'),'learnActionBar');
  const quizBtn=document.getElementById('quizNext');
  const quizBar=wrapActionButton(quizBtn,'quizActionBar');
  if(quizBtn&&quizBar){
    const sync=()=>quizBar.classList.toggle('hidden',quizBtn.classList.contains('hidden'));
    sync();
    new MutationObserver(sync).observe(quizBtn,{attributes:true,attributeFilter:['class']});
  }
})();
'''
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          if '<span class="pill version">v3.8</span>' not in s:
              raise SystemExit('index v3.8 marker missing')
          if '<script src="smart-tips.js?v=3.8"></script>' not in s:
              raise SystemExit('smart-tips v3.8 cache marker missing')
          s=s.replace('<span class="pill version">v3.8</span>','<span class="pill version">v3.9</span>',1)
          s=s.replace('<script src="smart-tips.js?v=3.8"></script>','<script src="smart-tips.js?v=3.9"></script>',1)
          p.write_text(s)
          PY
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html smart-tips.js
          git commit -m "Release v3.9 fixed action bars" || exit 0
          git push

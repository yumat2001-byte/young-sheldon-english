name: Release v3.7 quiz next layout

on:
  push:
    paths:
      - '.github/workflows/release-v37.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch quiz next button and version
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('smart-tips.js')
          s=p.read_text()
          old="document.querySelectorAll('.version').forEach(v=>v.textContent='v3.6');"
          if old not in s:
              raise SystemExit('smart-tips v3.6 version marker missing')
          s=s.replace(old,"document.querySelectorAll('.version').forEach(v=>v.textContent='v3.7');",1)

          old_block="    const title=quiz.querySelector('.row b');\n    if(title)title.textContent='TEST';\n  }\n"
          new_block="    const title=quiz.querySelector('.row b');\n    if(title)title.textContent='TEST';\n    const next=document.getElementById('quizNext');\n    if(next){\n      next.classList.remove('fixed-next');\n      next.classList.add('quiz-next-inline');\n      next.style.position='static';\n      next.style.width='100%';\n      next.style.minWidth='0';\n      next.style.marginTop='18px';\n      next.style.boxShadow='none';\n    }\n  }\n"
          if old_block not in s:
              raise SystemExit('quiz block marker missing')
          s=s.replace(old_block,new_block,1)
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          if '<span class="pill version">v3.6</span>' not in s:
              raise SystemExit('index v3.6 marker missing')
          if '<script src="smart-tips.js?v=3.6"></script>' not in s:
              raise SystemExit('smart-tips cache marker missing')
          s=s.replace('<span class="pill version">v3.6</span>','<span class="pill version">v3.7</span>',1)
          s=s.replace('<script src="smart-tips.js?v=3.6"></script>','<script src="smart-tips.js?v=3.7"></script>',1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html smart-tips.js
          git commit -m "Release v3.7 quiz next button layout" || exit 0
          git push

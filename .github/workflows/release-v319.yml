name: Release v3.19 cache-safe build

on:
  push:
    paths:
      - '.github/workflows/release-v319.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch v3.19
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'http-equiv="Cache-Control"' not in s:
              s=s.replace('<meta charset="utf-8">','<meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">',1)
          s=s.replace('v3.18','v3.19')
          p.write_text(s)
          for name in ['smart-tips.js','learning-plan.js','scene-context.js']:
              p=Path(name)
              if p.exists():
                  t=p.read_text().replace('v3.18','v3.19')
                  p.write_text(t)
          PY
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html smart-tips.js learning-plan.js scene-context.js
          git commit -m "Release v3.19 cache-safe build" || exit 0
          git push

name: Release v3.8 result word accordion

on:
  push:
    paths:
      - '.github/workflows/release-v38.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add inline result word details and bump version
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          snippet = base64.b64decode('').decode()

          p=Path('smart-tips.js')
          s=p.read_text()
          old="document.querySelectorAll('.version').forEach(v=>v.textContent='v3.7');"
          if old not in s:
              raise SystemExit('smart-tips v3.7 marker missing')
          s=s.replace(old,"document.querySelectorAll('.version').forEach(v=>v.textContent='v3.8');",1)
          if '/* v3.8 result-page word accordion */' not in s:
              s += snippet
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          if '<span class="pill version">v3.7</span>' not in s:
              raise SystemExit('index v3.7 marker missing')
          if '<script src="smart-tips.js?v=3.7"></script>' not in s:
              raise SystemExit('smart-tips v3.7 cache marker missing')
          s=s.replace('<span class="pill version">v3.7</span>','<span class="pill version">v3.8</span>',1)
          s=s.replace('<script src="smart-tips.js?v=3.7"></script>','<script src="smart-tips.js?v=3.8"></script>',1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html smart-tips.js
          git commit -m "Release v3.8 result word accordion" || exit 0
          git push

name: Release v3.13 quiz answer binding fix

on:
  push:
    paths:
      - '.github/workflows/release-v313.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bind quiz choices to their source words
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text()

          pattern=r"function renderQuiz\(\)\{.*?\}function nextQuiz\(\)\{"
          replacement="""function renderQuiz(){questionAnswered=false;let x=quizWords[qidx];quizCount.textContent=(qidx+1)+' / '+quizWords.length;quizWord.textContent=x.w;answerNote.className='answer-note hidden';feedback.classList.add('hidden');quizNext.classList.add('hidden');let pool=[x];while(pool.length<4){let w=words[Math.floor(Math.random()*words.length)];if(w.w!==x.w&&!pool.some(o=>o.m===w.m))pool.push(w)}pool.sort(()=>Math.random()-.5);options.innerHTML='';pool.forEach(w=>{let b=document.createElement('button');b.className='option';b.textContent=w.m;b.onclick=()=>answer(b,w,x);options.appendChild(b)})}function showOptionExplanation(w,kind){if(!w)return;answerNote.className='answer-note '+kind;answerNote.innerHTML='<b class=\"speakable\" onclick=\"speakText(&quot;'+w.w.replace(/&/g,'&amp;').replace(/\\\"/g,'&quot;')+'&quot;)\">'+w.w+'</b><br>'+w.m+'<div class=\"quiz-related\">'+relatedHTML(w)+'</div>';speakText(w.w)}function answer(btn,choice,x){if(questionAnswered){showOptionExplanation(choice,choice.w===x.w?'correct':'wrong');if(choice.w===x.w){feedback.innerHTML='<div class=\"example-text\">'+x.e+'</div><div class=\"example-ja\">'+x.j+'</div>';feedback.classList.remove('hidden')}else feedback.classList.add('hidden');return}if(choice.w!==x.w){if(btn.classList.contains('wrong')){showOptionExplanation(choice,'wrong');return}btn.classList.add('wrong');if(!currentWrong.includes(x.w))currentWrong.push(x.w);setMasteryWord(x.w,'苦手');showOptionExplanation(choice,'wrong');return}questionAnswered=true;if(!currentWrong.includes(x.w))score++;btn.classList.add('correct');if(quizMode!=='retest')promote(x.w);save();showOptionExplanation(x,'correct');feedback.innerHTML='<div class=\"example-text\">'+x.e+'</div><div class=\"example-ja\">'+x.j+'</div>';feedback.classList.remove('hidden');quizNext.classList.remove('hidden')}function nextQuiz(){"""
          s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'quiz function block replacement count={n}')
          s=s2

          if '<span class="pill version">v3.12</span>' not in s:
              raise SystemExit('index version marker missing')
          if '<script src="smart-tips.js?v=3.12"></script>' not in s:
              raise SystemExit('cache marker missing')
          s=s.replace('<span class="pill version">v3.12</span>','<span class="pill version">v3.13</span>',1)
          s=s.replace('<script src="smart-tips.js?v=3.12"></script>','<script src="smart-tips.js?v=3.13"></script>',1)
          p.write_text(s)

          p=Path('smart-tips.js')
          s=p.read_text()
          if "v.textContent='v3.12'" not in s:
              raise SystemExit('smart tips version marker missing')
          s=s.replace("v.textContent='v3.12'","v.textContent='v3.13'",1)
          p.write_text(s)
          PY
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html smart-tips.js
          git commit -m "Release v3.13 quiz answer binding fix" || exit 0
          git push

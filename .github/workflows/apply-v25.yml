name: Apply v2.5 app update
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          reps=[
          ('grid-template-columns:repeat(4,1fr);gap:7px;background:rgba(255,255,255,.95)','grid-template-columns:repeat(5,1fr);gap:7px;background:rgba(255,255,255,.95)'),
          ('nav button{margin:0;padding:11px 3px;font-size:12px}', 'nav button{margin:0;padding:11px 2px;font-size:11px}'),
          ('.today .small{color:#d1d5db}', '.today .small{color:#d1d5db}.today .version{background:#eef2f7;color:#64748b}'),
          ('<span class="pill">v2.4</span>', '<span class="pill version">v2.5</span>'),
          ("let colors={'苦手':'#22c55e','うろ覚え':'#eab308','ほぼ覚えた':'#3b82f6','覚えた':'#166534','未学習':'#d1d5db'}", "let colors={'苦手':'#D79A91','うろ覚え':'#D6BC72','ほぼ覚えた':'#8FA3B8','覚えた':'#86B99A','未学習':'#D1D5DB'}"),
          ('<button id="studyWrongBtn" onclick="startWrongStudy()"></button><button class="secondary" onclick="openEpisode()">Episode 1へ戻る</button>', '<button id="retestWrongBtn" onclick="startWrongRetest()"></button><button id="studyWrongBtn" onclick="startWrongStudy()"></button><button class="secondary" onclick="openEpisode()">Episode 1へ戻る</button>'),
          ('<nav><button onclick="show(\'home\')">HOME</button><button onclick="openEpisode()">EPISODE</button><button onclick="show(\'settings\')">TEST</button><button onclick="show(\'review\')">REVIEW</button></nav>', '<nav><button onclick="show(\'home\')">HOME</button><button onclick="openEpisode()">EPISODE</button><button onclick="showList()">LIST</button><button onclick="show(\'settings\')">TEST</button><button onclick="show(\'review\')">REVIEW</button></nav>'),
          ("let idx=0,qidx=0,score=0,answered=0,studyWords=[],quizWords=[],currentWrong=[],detailIndex=0,studyMode='set';", "let idx=0,qidx=0,score=0,answered=0,studyWords=[],quizWords=[],currentWrong=[],detailIndex=0,studyMode='set',questionAnswered=false;"),
          ("function startWrongStudy(){studyWords=words.filter(x=>currentWrong.includes(x.w));if(!studyWords.length){alert('今回のテストで間違えた単語はありません');return}idx=0;studyMode='wrong';show('learn');renderWord()}", "function startWrongStudy(){studyWords=words.filter(x=>currentWrong.includes(x.w));if(!studyWords.length){alert('今回のテストで間違えた単語はありません');return}idx=0;studyMode='wrong';show('learn');renderWord()}function startWrongRetest(){let retry=words.filter(x=>currentWrong.includes(x.w));if(!retry.length){alert('今回のテストで間違えた単語はありません');return}startQuiz(retry)}"),
          ("function startQuiz(custom){quizWords=custom?[...custom]:buildQuiz();qidx=0;score=0;answered=0;currentWrong=[];show('quiz');renderQuiz()}", "function startQuiz(custom){quizWords=custom?[...custom]:buildQuiz();qidx=0;score=0;answered=0;currentWrong=[];questionAnswered=false;show('quiz');renderQuiz()}"),
          ("function renderQuiz(){let x=quizWords[qidx];quizCount.textContent=(qidx+1)+' / '+quizWords.length;quizWord.textContent=x.w;answerNote.className='answer-note hidden';feedback.classList.add('hidden');quizNext.classList.add('hidden');", "function renderQuiz(){questionAnswered=false;let x=quizWords[qidx];quizCount.textContent=(qidx+1)+' / '+quizWords.length;quizWord.textContent=x.w;answerNote.className='answer-note hidden';feedback.classList.add('hidden');quizNext.classList.add('hidden');"),
          ("function answer(btn,m,x){if(m!==x.m){btn.classList.add('wrong');btn.disabled=true;if(!currentWrong.includes(x.w))currentWrong.push(x.w);setMasteryWord(x.w,'苦手');answerNote.className='answer-note wrong';let wrong=words.find(w=>w.m===m);answerNote.innerHTML=wrong?'<b>'+wrong.w+'</b><br>'+wrong.m+'<br><span class=\"small\">'+wrong.d+'</span>':'不正解';return}answered++;score++;btn.classList.add('correct');promote(x.w);save();answerNote.className='answer-note correct';answerNote.innerHTML='<b>'+x.w+'</b><br>'+x.m+'<br><span class=\"small\">'+x.d+'</span>';feedback.innerHTML='<div class=\"example-text\">'+x.e+'</div><div class=\"example-ja\">'+x.j+'</div>';feedback.classList.remove('hidden');document.querySelectorAll('.option').forEach(b=>b.disabled=true);quizNext.classList.remove('hidden');speakText(x.w)}", "function showOptionExplanation(m,kind){let w=words.find(x=>x.m===m);if(!w)return;answerNote.className='answer-note '+kind;answerNote.innerHTML='<b class=\"speakable\" onclick=\"speakText(&quot;'+w.w.replace(/&/g,'&amp;').replace(/\\\"/g,'&quot;')+'&quot;)\">'+w.w+'</b><br>'+w.m+'<br><span class=\"small\">'+w.d+'</span>'}function answer(btn,m,x){if(questionAnswered){showOptionExplanation(m,m===x.m?'correct':'wrong');if(m===x.m){feedback.innerHTML='<div class=\"example-text\">'+x.e+'</div><div class=\"example-ja\">'+x.j+'</div>';feedback.classList.remove('hidden')}else feedback.classList.add('hidden');return}if(m!==x.m){if(btn.classList.contains('wrong')){showOptionExplanation(m,'wrong');return}btn.classList.add('wrong');if(!currentWrong.includes(x.w))currentWrong.push(x.w);setMasteryWord(x.w,'苦手');showOptionExplanation(m,'wrong');return}questionAnswered=true;answered++;score++;btn.classList.add('correct');promote(x.w);save();showOptionExplanation(x.m,'correct');feedback.innerHTML='<div class=\"example-text\">'+x.e+'</div><div class=\"example-ja\">'+x.j+'</div>';feedback.classList.remove('hidden');quizNext.classList.remove('hidden');speakText(x.w)}"),
          ("studyWrongBtn.textContent='今回間違えた単語を STUDY（'+currentWrong.length+'）';", "studyWrongBtn.textContent='今回間違えた単語を STUDY（'+currentWrong.length+'）';studyWrongBtn.disabled=currentWrong.length===0;retestWrongBtn.textContent='間違えた'+currentWrong.length+'語だけ RETEST';retestWrongBtn.disabled=currentWrong.length===0;"),
          ]
          for old,new in reps:
              if old not in s:
                  raise SystemExit('Expected text not found: '+old[:120])
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit v2.5
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update app to v2.5"
          git push

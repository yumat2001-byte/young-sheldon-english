name: Apply v2.7 set action update
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<span class="pill version">v2.6</span>','<span class="pill version">v2.7</span>',1)
          # Add SET action chooser screen before settings.
          marker='<section id="settings" class="screen">'
          chooser='<section id="setActions" class="screen"><button class="back" onclick="openEpisode()">← Episode 1</button><div class="card"><div class="small">EPISODE 1</div><h2 id="setActionTitle">SET 1 · 10語</h2><p class="small">このSETで行う内容を選択してください。</p><button onclick="startChosenSetStudy()">STUDY · この10語を学習</button><button class="secondary" onclick="startChosenSetTest()">TEST · この10語だけテスト</button></div></section>'
          if 'id="setActions"' not in s:
              if marker not in s: raise SystemExit('settings marker not found')
              s=s.replace(marker,chooser+marker,1)
          # Clicking a SET row used to call startSet(i); route that function to chooser while preserving direct study through a new helper.
          old="function startSet(i){studyWords=words.slice(i*10,i*10+10);idx=0;studyMode='set';currentSet=i;save();show('learn');renderWord()}"
          new="function beginSetStudy(i){studyWords=words.slice(i*10,i*10+10);idx=0;studyMode='set';currentSet=i;save();show('learn');renderWord()}function startSet(i){currentSet=i;save();setActionTitle.textContent='SET '+(i+1)+' · '+words.slice(i*10,i*10+10).length+'語';show('setActions')}function startChosenSetStudy(){beginSetStudy(currentSet)}function startChosenSetTest(){startQuiz(words.slice(currentSet*10,currentSet*10+10))}"
          if old in s:
              s=s.replace(old,new,1)
          elif 'function startChosenSetTest()' not in s:
              raise SystemExit('startSet function not found')
          # Current SET button should still start learning immediately, not open chooser.
          old2="function startCurrentSet(){startSet(currentSet)}"
          new2="function startCurrentSet(){beginSetStudy(currentSet)}"
          if old2 in s:
              s=s.replace(old2,new2,1)
          elif new2 not in s:
              raise SystemExit('startCurrentSet function not found')
          p.write_text(s)
          PY
      - name: Commit v2.7
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add SET study or test chooser"
          git push

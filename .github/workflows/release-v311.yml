name: Release v3.11 result actions cleanup

on:
  push:
    paths:
      - '.github/workflows/release-v311.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simplify result actions
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text()

          old='<button id="studyWrongBtn" onclick="startWrongStudy()"></button><button class="secondary" id="retestWrongBtn" onclick="startWrongRetest()"></button><button class="secondary" onclick="openEpisode()">Episode 1へ戻る</button>'
          new='<button id="retestWrongBtn" onclick="startWrongRetest()"></button><button class="secondary" id="reviewBackBtn" onclick="openEpisode()">Episode 1へ戻る</button>'
          if old not in s:
              raise SystemExit('review buttons marker missing')
          s=s.replace(old,new,1)

          old="function startWrongStudy(){studyWords=words.filter(x=>currentWrong.includes(x.w));if(!studyWords.length){alert('今回のテストで間違えた単語はありません');return}idx=0;studyMode='wrong';show('learn');renderWord()}"
          if old not in s:
              raise SystemExit('startWrongStudy marker missing')
          s=s.replace(old,'',1)

          old="studyWrongBtn.textContent=currentWrong.length?'間違えた'+currentWrong.length+'語を学習':'間違いなし';studyWrongBtn.disabled=currentWrong.length===0;retestWrongBtn.textContent=currentWrong.length?'間違えた'+currentWrong.length+'語を再テスト':'再テスト不要';retestWrongBtn.disabled=currentWrong.length===0;"
          new="if(currentWrong.length){retestWrongBtn.textContent='間違えた'+currentWrong.length+'語をテスト';retestWrongBtn.classList.remove('hidden');reviewBackBtn.classList.add('secondary')}else{retestWrongBtn.classList.add('hidden');reviewBackBtn.classList.remove('secondary')}"
          if old not in s:
              raise SystemExit('result action state marker missing')
          s=s.replace(old,new,1)

          if '<span class="pill version">v3.10</span>' not in s:
              raise SystemExit('index version marker missing')
          if '<script src="smart-tips.js?v=3.10"></script>' not in s:
              raise SystemExit('cache marker missing')
          s=s.replace('<span class="pill version">v3.10</span>','<span class="pill version">v3.11</span>',1)
          s=s.replace('<script src="smart-tips.js?v=3.10"></script>','<script src="smart-tips.js?v=3.11"></script>',1)
          p.write_text(s)

          p=Path('smart-tips.js')
          s=p.read_text()
          if "v.textContent='v3.10'" not in s:
              raise SystemExit('smart tips version marker missing')
          s=s.replace("v.textContent='v3.10'","v.textContent='v3.11'",1)

          old="box.innerHTML='<div class=\"detail-label\">間違えた単語　'+wrong.length+'語</div>'+(wrong.length?wrong.map(accordionRow).join(''):'<p class=\"small\">なし</p>')+(correct.length?'<details class=\"review-details\"><summary>正解した'+correct.length+'語を見る</summary>'+correct.map(accordionRow).join('')+'</details>':'');"
          new="box.innerHTML=(wrong.length?'<div class=\"detail-label\">間違えた単語　'+wrong.length+'語</div>'+wrong.map(accordionRow).join(''):'')+(correct.length?'<details class=\"review-details\"><summary>正解した'+correct.length+'語を見る</summary>'+correct.map(accordionRow).join('')+'</details>':'');"
          if old not in s:
              raise SystemExit('review zero-wrong marker missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html smart-tips.js
          git commit -m "Release v3.11 result actions cleanup" || exit 0
          git push

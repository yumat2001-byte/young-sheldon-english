name: Bump v3.6 cache-safe release

on:
  push:
    paths:
      - '.github/workflows/bump-v36.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update displayed version and script revision
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if '<span class="pill version">v3.5</span>' not in s:
              raise SystemExit('v3.5 marker missing')
          s=s.replace('<span class="pill version">v3.5</span>','<span class="pill version">v3.6</span>',1)
          s=s.replace('<script src="smart-tips.js"></script>','<script src="smart-tips.js?v=3.6"></script>',1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Bump app shell to v3.6" || exit 0
          git push

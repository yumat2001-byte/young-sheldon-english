name: Release v3.17 episode context upgrade

on:
  push:
    paths:
      - '.github/workflows/release-v317.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch v3.17
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<span class="pill version">v3.16</span>','<span class="pill version">v3.17</span>',1)
          s=s.replace('<script src="smart-tips.js?v=3.16"></script>','<script src="smart-tips.js?v=3.17"></script><script src="scene-context.js?v=3.17"></script>',1)
          s=s.replace('<div class="small">本編フレーズ</div>','<div class="small">本編の実際のセリフ</div>')
          p.write_text(s)
          p=Path('smart-tips.js')
          t=p.read_text()
          t=t.replace("v.textContent='v3.16'","v.textContent='v3.17'",1)
          t=t.replace('<div class="small">本編フレーズ</div>','<div class="small">本編の実際のセリフ</div>')
          p.write_text(t)
          PY
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html smart-tips.js scene-context.js
          git commit -m "Release v3.17 episode context upgrade" || exit 0
          git push

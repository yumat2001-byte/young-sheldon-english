name: Release v3.18 subtitle-free learning system

on:
  push:
    paths:
      - '.github/workflows/release-v318.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch v3.18
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if '<span class="pill version">v3.17</span>' not in s:
              raise SystemExit('v3.17 marker missing')
          if '<script src="smart-tips.js?v=3.17"></script>' not in s:
              raise SystemExit('smart-tips v3.17 marker missing')
          if '<script src="scene-context.js?v=3.17"></script>' not in s:
              raise SystemExit('scene-context v3.17 marker missing')
          s=s.replace('<span class="pill version">v3.17</span>','<span class="pill version">v3.18</span>',1)
          s=s.replace('<script src="smart-tips.js?v=3.17"></script>','<script src="smart-tips.js?v=3.18"></script>',1)
          s=s.replace('<script src="scene-context.js?v=3.17"></script>','<script src="scene-context.js?v=3.18"></script><script src="learning-plan.js?v=3.18"></script>',1)
          p.write_text(s)

          p=Path('smart-tips.js')
          t=p.read_text()
          t=t.replace("v.textContent='v3.17'","v.textContent='v3.18'",1)
          p.write_text(t)
          PY
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html smart-tips.js learning-plan.js
          git commit -m "Release v3.18 subtitle-free learning system" || exit 0
          git push

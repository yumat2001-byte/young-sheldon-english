name: Release v3.15 vocabulary expansion

on:
  push:
    paths:
      - '.github/workflows/release-v315.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add SET 5-8 and bump version
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text()
          before=re.findall(r"W\('([^']+)'",s)
          if len(before)!=40:
              raise SystemExit(f'expected 40 words before expansion, found {len(before)}')

          new_entries=r""",W('assaulted','/əˈsɔːltɪd/','暴行を受けた・襲われた','人から身体的な攻撃を受けた状態。',[['動','assault','襲う・暴行する'],['類','attack','攻撃する']],['physically assaulted','身体的に襲われた'],'He was assaulted outside the station.','彼は駅の外で襲われた'),W('haven','/ˈheɪvən/','安全な場所・避難所','危険や不安から逃れて安心できる場所。',[['類','refuge','避難所'],['類','shelter','避難場所']],['a safe haven','安全な避難場所'],'The library is a haven for quiet study.','図書館は静かに勉強するための安心できる場所だ'),W('retaliate','/rɪˈtælieɪt/','報復する・やり返す','相手から受けた行為に対して仕返しする。',[['名','retaliation','報復'],['類','strike back','反撃する']],['retaliate against','〜に報復する'],'Do not retaliate when someone insults you.','誰かに侮辱されてもやり返してはいけない'),W('admirable','/ˈædmərəbəl/','立派な・称賛に値する','尊敬や称賛に値する性質を表す。',[['動','admire','称賛する'],['名','admiration','称賛']],['an admirable effort','立派な努力'],'Her patience was admirable.','彼女の忍耐力は立派だった'),W('handbook','/ˈhændbʊk/','手引書・ハンドブック','規則や手順などをまとめた小型の案内書。',[['類','manual','手引書'],['類','guide','案内書']],['student handbook','生徒手帳・学生向け規則集'],'Check the employee handbook first.','まず社員ハンドブックを確認して'),W('extreme','/ɪkˈstriːm/','極端な・非常に激しい','程度が通常の範囲を大きく超えていること。',[['副','extremely','非常に'],['類','severe','深刻な・激しい']],['extreme weather','異常気象・極端な天候'],'Avoid extreme temperatures.','極端な温度を避けて'),W('argument','/ˈɑːrɡjəmənt/','口論・議論','意見の食い違いによる口論や、理由を示す議論。',[['動','argue','言い争う・主張する'],['類','dispute','論争']],['have an argument','口論する'],'They had an argument about money.','彼らはお金のことで口論した'),W('marriage','/ˈmærɪdʒ/','結婚・婚姻','二人が婚姻関係にある状態や制度。',[['動','marry','結婚する'],['形','married','結婚している']],['a happy marriage','幸せな結婚生活'],'Their marriage lasted many years.','彼らの結婚生活は長年続いた'),W('freshman','/ˈfreʃmən/','1年生・新入生','米国の高校や大学などの1年生。',[['関','sophomore','2年生'],['関','senior','最上級生']],['freshman year','1年生の年'],'He is a freshman in high school.','彼は高校1年生だ'),W('license','/ˈlaɪsəns/','免許・許可証','特定の活動を公式に許可する証明書。',[['形','licensed','免許を持つ'],['類','permit','許可証']],['a valid license','有効な免許証'],'You need a valid license to drive.','運転には有効な免許が必要だ'),W('prime','/praɪm/','素数の・主要な','数学では1と自分自身以外で割り切れない数を表す。',[['句','prime number','素数'],['類','primary','主要な']],['a prime number','素数'],'Seven is a prime number.','7は素数だ'),W('recognize','/ˈrekəɡnaɪz/','認識する・見分ける','見たり聞いたりして以前知っていたものだと分かる。',[['名','recognition','認識'],['類','identify','特定する']],['recognize a face','顔を見分ける'],'I recognized her voice immediately.','私はすぐに彼女の声だと分かった'),W('fad','/fæd/','一時的な流行','短期間だけ急に人気になるもの。',[['類','trend','傾向・流行'],['類','craze','大流行']],['a passing fad','一時的な流行'],'The style became a short-lived fad.','そのスタイルは短期間の流行になった'),W('ammonia','/əˈmoʊniə/','アンモニア','刺激臭のある化学物質。洗浄剤などにも使われる。',[['関','chemical','化学物質'],['関','cleaner','洗浄剤']],['the smell of ammonia','アンモニアのにおい'],'The room smelled of ammonia.','部屋はアンモニアのにおいがした'),W('homeroom','/ˈhoʊmruːm/','ホームルーム・学級','学校で出欠確認や連絡などを行う基本のクラス。',[['関','classroom','教室'],['関','teacher','教師']],['homeroom teacher','担任の先生'],'Our homeroom teacher took attendance.','担任の先生が出席を取った'),W('attire','/əˈtaɪər/','服装・衣装','特定の場面で身につける服装をややフォーマルに表す。',[['類','clothing','衣類'],['類','outfit','服装']],['business attire','ビジネス向けの服装'],'Formal attire is required.','正装が必要です'),W('grooming','/ˈɡruːmɪŋ/','身だしなみ・手入れ','髪やひげ、服装などを整えること。',[['動','groom','身だしなみを整える'],['関','appearance','外見']],['grooming standards','身だしなみ基準'],'The company has grooming standards.','その会社には身だしなみ基準がある'),W('blouse','/blaʊs/','ブラウス','主に女性用の上半身に着る衣服。',[['類','shirt','シャツ'],['関','clothing','衣類']],['a white blouse','白いブラウス'],'She wore a white blouse.','彼女は白いブラウスを着ていた'),W('accuse','/əˈkjuːz/','非難する・告発する','誰かが悪いことをしたと主張する。',[['名','accusation','告発・非難'],['類','blame','責める']],['accuse someone of','人を〜で非難する'],'They accused him of cheating.','彼らは彼を不正行為で非難した'),W('intelligence','/ɪnˈtelɪdʒəns/','知能・知性','学習し、理解し、考える能力。',[['形','intelligent','知的な'],['類','intellect','知性']],['artificial intelligence','人工知能'],'The test measures several kinds of intelligence.','そのテストはいくつかの種類の知能を測る'),W('sonata','/səˈnɑːtə/','ソナタ・奏鳴曲','主に器楽のために作られた楽曲形式。',[['関','composition','作曲・楽曲'],['関','movement','楽章']],['piano sonata','ピアノソナタ'],'She played a piano sonata.','彼女はピアノソナタを演奏した'),W('calculus','/ˈkælkjələs/','微積分','変化率や面積などを扱う数学の分野。',[['関','derivative','導関数'],['関','integral','積分']],['study calculus','微積分を学ぶ'],'He started studying calculus early.','彼は早くから微積分を学び始めた'),W('Euclidean','/juˈklɪdiən/','ユークリッドの・ユークリッド幾何学の','古典的なユークリッド幾何学に関する形容詞。',[['名','Euclid','ユークリッド'],['関','geometry','幾何学']],['Euclidean geometry','ユークリッド幾何学'],'The class covers Euclidean geometry.','その授業ではユークリッド幾何学を扱う'),W('geometry','/dʒiˈɑːmətri/','幾何学','形、角度、距離、空間などを扱う数学分野。',[['形','geometric','幾何学の'],['関','shape','形']],['study geometry','幾何学を学ぶ'],'Geometry deals with shapes and space.','幾何学は形と空間を扱う'),W('pitch','/pɪtʃ/','音の高さ・投球','音楽では音の高低を表し、スポーツでは投球なども意味する。',[['句','perfect pitch','絶対音感'],['関','tone','音色・音']],['have perfect pitch','絶対音感がある'],'She has perfect pitch.','彼女には絶対音感がある'),W('musician','/mjuˈzɪʃən/','音楽家・演奏家','音楽を演奏したり作ったりする人。',[['名','music','音楽'],['形','musical','音楽の']],['professional musician','プロの音楽家'],'He works as a professional musician.','彼はプロの音楽家として働いている'),W('principal','/ˈprɪnsəpəl/','校長・主要な','学校の校長という意味でよく使う。principleとは別語。',[['類','headteacher','校長'],['対','principle','原理・原則']],['school principal','学校の校長'],'The principal called a meeting.','校長が会議を開いた'),W('uniform','/ˈjuːnəfɔːrm/','制服・ユニフォーム','同じ組織やチームの人が共通して着る服。',[['関','attire','服装'],['形','uniform','均一な']],['school uniform','学校の制服'],'Players wore the same uniform.','選手たちは同じユニフォームを着ていた'),W('ordinary','/ˈɔːrdəneri/','普通の・平凡な','特別ではなく通常であること。',[['副','ordinarily','通常は'],['類','normal','普通の']],['an ordinary day','普通の日'],'It looked like an ordinary day.','普通の日のように見えた'),W('supplies','/səˈplaɪz/','用品・備品','仕事や学習などに必要な物品。',[['動','supply','供給する'],['類','materials','資材・材料']],['school supplies','学用品'],'Buy the school supplies before Monday.','月曜日までに学用品を買って'),W('grip','/ɡrɪp/','握ること・握り','何かを手でしっかりつかむこと。',[['動','grip','しっかり握る'],['類','grasp','つかむ']],['a firm grip','しっかりした握り'],'Keep a firm grip on the handle.','取っ手をしっかり握って'),W('rat out','/ræt aʊt/','密告する・告げ口する','くだけた表現で、誰かの悪事などを他人に告げる。',[['類','snitch','密告する'],['類','inform on','〜を密告する']],['rat someone out','人を密告する'],'He refused to rat out his friend.','彼は友人を密告することを拒んだ'),W('complicated','/ˈkɑːmpləkeɪtɪd/','複雑な・ややこしい','多くの要素が絡み、理解や処理が難しいこと。',[['動','complicate','複雑にする'],['類','complex','複雑な']],['a complicated problem','複雑な問題'],'The rules are more complicated than they look.','その規則は見た目より複雑だ'),W('justice','/ˈdʒʌstɪs/','正義・公正','公平で正しい扱いや、法による正義。',[['形','just','公正な'],['類','fairness','公平さ']],['seek justice','正義を求める'],'The family wanted justice.','その家族は正義を求めた'),W('fired','/ˈfaɪərd/','解雇された','仕事を辞めさせられた状態。',[['動','fire','解雇する'],['類','dismissed','解雇された']],['get fired','解雇される'],'He was fired from his job.','彼は仕事を解雇された'),W('deserve','/dɪˈzɜːrv/','〜に値する・受けるにふさわしい','行動や状況から何かを受けるのが妥当であること。',[['形','deserving','〜に値する'],['類','merit','値する']],['deserve a chance','機会を与えられるに値する'],'Everyone deserves a fair chance.','誰にでも公平な機会が与えられるべきだ'),W('afford','/əˈfɔːrd/','〜する余裕がある','費用や時間などを負担できる余裕があること。',[['形','affordable','手頃な'],['関','cost','費用']],['can afford to','〜する余裕がある'],'They cannot afford a new car.','彼らには新しい車を買う余裕がない'),W('private','/ˈpraɪvət/','私的な・民間の','公的ではなく個人や特定の組織に属すること。',[['名','privacy','プライバシー'],['対','public','公の']],['private school','私立学校'],'She attends a private school.','彼女は私立学校に通っている'),W('comforting','/ˈkʌmfərtɪŋ/','安心させる・心強い','不安や悲しみを和らげる性質を表す。',[['動','comfort','慰める'],['類','reassuring','安心させる']],['a comforting thought','安心できる考え'],'His message was comforting.','彼のメッセージは心強かった'),W('pregnant','/ˈpreɡnənt/','妊娠している','胎児を身ごもっている状態。',[['名','pregnancy','妊娠'],['関','expecting','妊娠している']],['be pregnant','妊娠している'],'She is pregnant with her first child.','彼女は第一子を妊娠している')"""

          marker='];const SET_SIZE=10;'
          if marker not in s:
              raise SystemExit('word-array marker missing')
          s=s.replace(marker,new_entries+marker,1)

          if '<span class="pill version">v3.14</span>' not in s:
              raise SystemExit('index version marker missing')
          if '<script src="smart-tips.js?v=3.14"></script>' not in s:
              raise SystemExit('cache marker missing')
          s=s.replace('<span class="pill version">v3.14</span>','<span class="pill version">v3.15</span>',1)
          s=s.replace('<script src="smart-tips.js?v=3.14"></script>','<script src="smart-tips.js?v=3.15"></script>',1)

          after=re.findall(r"W\('([^']+)'",s)
          if len(after)!=80 or len(set(after))!=80:
              raise SystemExit(f'word expansion invalid: count={len(after)}, unique={len(set(after))}')
          for required in ['assaulted','freshman','principal','rat out','comforting']:
              if required not in after:
                  raise SystemExit(f'missing required word: {required}')
          p.write_text(s)

          p=Path('smart-tips.js')
          t=p.read_text()
          if "v.textContent='v3.14'" not in t:
              raise SystemExit('smart tips version marker missing')
          t=t.replace("v.textContent='v3.14'","v.textContent='v3.15'",1)
          p.write_text(t)
          PY
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html smart-tips.js
          git commit -m "Release v3.15 with SET 5-8" || exit 0
          git push

name: Release v3.3

on:
  push:
    paths:
      - '.github/workflows/patch-list-study.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Restore full app and bump version
        run: |
          git show c41a9281c67f8dcc439b8b9632a2c44ed9fa4bd1:index.html > index.html
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<span class="pill version">v3.2</span>','<span class="pill version">v3.3</span>',1)
          p.write_text(s)
          PY
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Release v3.3" || exit 0
          git push

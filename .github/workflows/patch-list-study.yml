name: Release v3.4 cleanup

on:
  push:
    paths:
      - '.github/workflows/patch-list-study.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refactor app without changing behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<span class="pill version">v3.3</span>','<span class="pill version">v3.4</span>',1)

          review_css='.review-group{margin-top:20px}.review-head{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:850;padding:10px 0;border-bottom:1px solid var(--line)}.review-head.bad{color:var(--bad)}.review-head.good{color:var(--good)}.tap-hint{font-size:11px;color:var(--muted);font-weight:600}'
          while review_css+review_css in s:
              s=s.replace(review_css+review_css,review_css,1)

          def remove_between(text,start,end):
              a=text.find(start)
              b=text.find(end,a)
              return text if a<0 or b<0 else text[:a]+text[b:]

          s=remove_between(s,'<section id="setActions" class="screen">','<section id="settings" class="screen">')
          s=remove_between(s,'<section id="detail" class="screen">','<section id="quiz" class="screen">')

          s=s.replace("function startSet(n){beginSetStudy(n)}function startChosenSetStudy(){beginSetStudy(currentSet)}function startChosenSetTest(){startQuiz(words.slice((currentSet-1)*SET_SIZE,currentSet*SET_SIZE))}","function startSet(n){beginSetStudy(n)}",1)

          a=s.find('function openDetail(i){')
          b=s.find('function renderCountChoices(){',a)
          if a>=0 and b>=0:
              s=s[:a]+s[b:]

          old_state="let idx=0,qidx=0,score=0,answered=0,studyWords=[],quizWords=[],currentWrong=[],currentCorrect=[],detailIndex=0,studyMode='set',questionAnswered=false;"
          new_state="let idx=0,qidx=0,score=0,studyWords=[],quizWords=[],currentWrong=[],studyMode='set',questionAnswered=false,quizMode='normal';"
          if old_state in s:
              s=s.replace(old_state,new_state,1)

          s=s.replace("qidx=0;score=0;answered=0;currentWrong=[];currentCorrect=[];questionAnswered=false;","qidx=0;score=0;currentWrong=[];questionAnswered=false;",1)
          s=s.replace("currentCorrect=currentCorrect.filter(w=>w!==x.w);",'',1)
          s=s.replace("questionAnswered=true;answered++;if(!currentWrong.includes(x.w)){score++;if(!currentCorrect.includes(x.w))currentCorrect.push(x.w)}","questionAnswered=true;if(!currentWrong.includes(x.w))score++;",1)
          s=s.replace('<script src="v3.2-upgrade.js"></script>','<script src="smart-tips.js"></script>',1)
          p.write_text(s)

          old=Path('v3.2-upgrade.js')
          if old.exists():
              t=old.read_text()
              t=t.replace('/* Young Sheldon English v3.2 upgrade\n   Contextual memory hooks only when useful; no forced mnemonics.\n*/','/* Vocabulary memory tips: contextual hooks only when useful. */',1)
              t=t.replace(",\n    arrangement:{title:'WORD PARTS',html:'<b>-ment</b> は名詞を作る代表的な語尾。arrange → arrangement のように「行為・結果」を表す名詞になることが多い。'}",'',1)
              t=t.replace("    {re:/^re/i,label:'re-',text:'「再び・戻って」を表すことが多い接頭辞。ただし全ての re- 語に機械的に当てはめない。'},\n",'',1)
              old_detail="  const oldDetail=window.openDetail;\n  if(typeof oldDetail==='function')window.openDetail=function(i){oldDetail.apply(this,arguments);const b=ensureBox('detailLearn','detailMemoryTip');paint(b,words[i]);};\n"
              t=t.replace(old_detail,'',1)
              t=t.replace("  document.querySelectorAll('.version').forEach(v=>{if(v.textContent.trim()==='v3.1')v.textContent='v3.2'});\n",'',1)
              Path('smart-tips.js').write_text(t)
              old.unlink()
          PY
          rm -f .github/workflows/patch-list-study.yml
      - name: Commit v3.4 cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Refactor duplicate and dead app code for v3.4"
          git push

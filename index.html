/div><div class="example-text">'+x.e+'</div><div class="example-ja">'+x.j+'</div>';feedback.classList.remove('hidden')}else feedback.classList.add('hidden');return}if(choice.w!==x.w){if(btn.classList.contains('wrong')){showOptionExplanation(choice,'wrong');return}btn.classList.add('wrong');if(!currentWrong.includes(x.w))currentWrong.push(x.w);setMasteryWord(x.w,'苦手');showOptionExplanation(choice,'wrong');return}questionAnswered=true;if(!currentWrong.includes(x.w))score++;btn.classList.add('correct');if(quizMode!=='retest'&&!currentWrong.includes(x.w))promote(x.w);save();showOptionExplanation(x,'correct');feedback.innerHTML='<div class="small">本編の実際のセリフ</div><div class="example-text">'+x.e+'</div><div class="example-ja">'+x.j+'</div>';feedback.classList.remove('hidden');quizNext.classList.remove('hidden')}function nextQuiz(){if(qidx<quizWords.length-1){qidx++;renderQuiz()}else{syncUnlock();save();show('review');renderReviewLists()}}function reviewWordRow(w){let i=words.findIndex(x=>x.w===w.w);return '<div class="list-item" onclick="studySingleWord('+i+')"><div class="list-word speakable" onclick="event.stopPropagation();speakText(\''+w.w.replace(/'/g,"\\'")+'\')">'+w.w+'</div><div class="list-meaning">'+w.m+'</div></div>'}function renderReviewLists(){if(!document.getElementById('reviewWordLists'))return;let wrong=quizWords.filter(x=>currentWrong.includes(x.w)),correct=quizWords.filter(x=>!currentWrong.includes(x.w));reviewWordLists.innerHTML='<div class="detail-label">間違えた単語　'+wrong.length+'語</div>'+(wrong.length?wrong.map(reviewWordRow).join(''):'<p class="small">なし</p>')+(correct.length?'<details class="review-details"><summary>正解した'+correct.length+'語を見る</summary>'+correct.map(reviewWordRow).join('')+'</details>':'')}function updateStats(){syncUnlock();let c=l=>words.filter(x=>masteryOf(x.w)===l).length;knownStat.textContent=c('覚えた');almostStat.textContent=c('ほぼ覚えた');fuzzyStat.textContent=c('うろ覚え');weakStat.textContent=c('苦手');scoreStat.textContent=quizWords.length

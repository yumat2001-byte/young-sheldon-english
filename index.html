<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Young Sheldon English</title><style>:root{--bg:#f5f7fb;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--good:#166534;--goodbg:#f0fdf4;--bad:#991b1b;--badbg:#fef2f2}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}main{max-width:720px;margin:auto;padding:24px 16px 120px}.hero{padding:22px 4px 12px}.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700}h1{font-size:30px;line-height:1.05;margin:8px 0}.sub{color:var(--muted);line-height:1.6}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:14px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.pill,.mastery{font-size:12px;background:#eef2f7;padding:7px 10px;border-radius:999px}.mastery[data-level="苦手"]{color:#16a34a;font-weight:800}.mastery[data-level="うろ覚え"]{color:#ca8a04;font-weight:800}.mastery[data-level="ほぼ覚えた"]{color:#2563eb;font-weight:800}.mastery[data-level="覚えた"]{color:#166534;font-weight:800}.progress{height:9px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:12px}.progress>div{height:100%;background:var(--accent)}button{width:100%;border:0;border-radius:15px;padding:14px 16px;font-size:16px;font-weight:700;background:var(--accent);color:#fff;margin-top:10px}button.secondary{background:#eef2f7;color:var(--ink)}button.option{background:#fff;color:var(--ink);border:1.5px solid var(--line);text-align:left}button.option.correct{border-color:var(--good);color:var(--good);background:var(--goodbg)}button.option.wrong{border-color:var(--bad);color:var(--bad);background:var(--badbg)}.word{font-size:34px;font-weight:850;margin:8px 0}.speakable{cursor:pointer}.pron,.small{color:var(--muted);font-size:13px}.meaning{font-size:19px;font-weight:700;margin-top:12px}.example{padding:14px;background:#f8fafc;border-radius:14px;margin-top:12px;line-height:1.5}.example-text{font-size:17px;font-weight:700}.example-ja{font-size:14px;color:var(--muted);margin-top:7px}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f8fafc;border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:20px}.list-item{padding:15px 0;border-bottom:1px solid var(--line);cursor:pointer}.list-word{font-size:19px;font-weight:800}.list-meaning{font-size:14px;color:var(--muted);margin-top:3px}.detail-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.detail-label{font-size:17px;font-weight:800;margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}.detail-desc{line-height:1.8;margin-top:10px}.learn-row{margin:8px 0}.tag{display:inline-block;min-width:28px;text-align:center;background:#6b7280;color:white;border-radius:6px;padding:1px 5px;margin-right:7px;font-size:12px;font-weight:800}.usage{padding:14px;background:#f8fafc;border-radius:14px;margin-top:12px}.usage b{display:block}.usage span{display:block;color:var(--muted);font-size:14px;margin-top:5px}.mastery-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.mastery-grid button{margin:0;background:#f3f4f6;color:var(--ink);font-size:13px}.mastery-grid button.active{background:var(--accent);color:#fff}.answer-note{margin-top:12px;padding:14px;border-radius:14px;cursor:pointer}.answer-note.wrong{background:var(--badbg);color:var(--bad)}.answer-note.correct{background:var(--goodbg);color:var(--good)}.answer-word{font-size:22px;font-weight:850}.answer-detail{margin-top:8px;color:var(--ink);line-height:1.7}.answer-related{margin-top:10px;color:var(--ink)}nav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));width:min(calc(100% - 32px),688px);display:grid;grid-template-columns:repeat(4,1fr);gap:7px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);padding:7px;border:1px solid var(--line);border-radius:18px}nav button{margin:0;padding:11px 3px;font-size:12px}.screen{display:none}.screen.active{display:block}.quiz-next-fixed,.learn-next-fixed{position:fixed;z-index:30;right:max(22px,calc((100vw - 720px)/2 + 22px));bottom:calc(max(10px,env(safe-area-inset-bottom)) + 68px);width:auto;min-width:140px;padding:14px 22px;box-shadow:0 8px 25px rgba(17,24,39,.2)}body.quiz-mode .hero,body.list-mode .hero,body.learn-mode .hero{display:none}body.quiz-mode main,body.list-mode main,body.learn-mode main{padding-top:8px}</style></head><body><main><section class="hero"><div class="eyebrow">YOUNG SHELDON ENGLISH</div><h1>Watch less.<br>Remember more.</h1><div class="sub">Season 1, Episode 1</div></section><section id="home" class="screen active"><div class="card"><div class="row"><b>Season 1 · Episode 1</b><span class="pill">v1.9</span></div><div class="progress"><div id="homeProgress"></div></div><p class="small" id="progressText"></p><button onclick="startLearn()">事前学習を始める</button><button class="secondary" onclick="showList()">単語一覧を見る</button></div><div class="card"><b>今日の状態</b><div class="stats" style="margin-top:12px"><div class="stat"><b id="learnedStat">0</b><span class="small">学習</span></div><div class="stat"><b id="correctStat">0%</b><span class="small">正答率</span></div><div class="stat"><b id="weakStat">0</b><span class="small">苦手</span></div></div></div></section><section id="learn" class="screen"><div class="card"><div class="row"><span class="pill" id="counter"></span><span class="mastery" id="learnMastery"></span></div><div class="word speakable" id="word" onclick="speakText(currentLearnWord().w)"></div><div class="pron" id="pron"></div><div class="meaning" id="meaning"></div><div class="detail-label">解説</div><div class="detail-desc" id="learnDesc"></div><div id="learnRelated"></div><div class="example speakable" id="example" onclick="speakText(currentLearnWord().e)"></div><div class="detail-label">習熟度</div><div class="mastery-grid" id="learnMasteryButtons"></div><button id="nextBtn" class="learn-next-fixed" onclick="nextWord()">次へ</button></div></section><section id="list" class="screen"><div class="card"><div class="row"><b>Episode 1 単語一覧</b><span class="pill">10 words</span></div><div id="wordList"></div></div></section><section id="detail" class="screen"><div class="card"><button class="secondary" style="width:auto;margin:0" onclick="showList()">← 一覧</button><div class="detail-top"><div><div class="word speakable" id="detailWord" onclick="speakDetail()"></div><div class="pron" id="detailPron"></div></div><span class="mastery" id="detailMastery"></span></div><div class="meaning" id="detailMeaning"></div><div class="detail-label">解説</div><div class="detail-desc" id="detailDesc"></div><div id="detailLearn"></div><div class="example speakable" id="detailExample" onclick="speakDetailExample()"></div><div class="detail-label">習熟度</div><div class="mastery-grid" id="masteryButtons"></div></div></section><section id="quiz" class="screen"><div class="card"><div class="row"><b>Quick Test</b><span class="pill" id="quizCount"></span></div><div class="word speakable" id="quizWord" onclick="speakText(words[qidx].w)"></div><div id="options"></div><div id="answerNote" class="answer-note hidden" onclick="speakAnswerWord()"></div><div id="feedback" class="example hidden speakable" onclick="speakText(words[qidx].e)"></div><button id="quizNext" class="quiz-next-fixed hidden" onclick="nextQuiz()">次の問題</button></div></section><section id="review" class="screen"><div class="card"><b>After Watching</b><h2>視聴後レビュー</h2><button id="studyWrongBtn" onclick="startWrongStudy()"></button><button onclick="startQuiz()">復習テストを開始</button><button class="secondary" onclick="resetData()">学習データをリセット</button></div></section><nav><button onclick="show('home')">HOME</button><button onclick="showList()">LIST</button><button onclick="startQuiz()">TEST</button><button onclick="show('review')">REVIEW</button></nav></main><script>const words=[{w:'nourishment',p:'/ˈnɜːrɪʃmənt/',m:'栄養・滋養',d:'食べ物などから得る「栄養」。比喩的に、心や精神を豊かにするものにも使う。',learn:[['形','nourishing','栄養になる・心を豊かにする'],['動','nourish','栄養を与える・育む'],['類','nutrition','栄養（栄養学的な意味でよく使う）']],u:['provide nourishment','栄養を与える'],e:'nourishment of our bodies',j:'私たちの体の栄養',i:'Useful'},{w:'revolting',p:'/rɪˈvoʊltɪŋ/',m:'ひどく不快な・気持ち悪い',d:'単に unpleasant よりかなり強く、「嫌悪感を覚えるほど気持ち悪い」という表現。人・味・臭い・行為などに使える。',learn:[['動','revolt','反乱する／ひどく不快にさせる'],['類','disgusting','むかつくほど不快な'],['類','gross','気持ち悪い（口語）']],u:['That is revolting.','それは本当に気持ち悪い'],e:'Well, that was revolting.',j:'うわ、それは気持ち悪かった',i:'Useful'},{w:'credentials',p:'/krəˈdenʃəlz/',m:'資格・経歴・実績',d:'「資格」だけでなく、学歴・職歴・実績など、その人の能力や立場を証明するもの全体。複数形 credentials で使うことが多い。',learn:[['単','credential','資格・証明書'],['類','qualification','資格・適性'],['関','experience','経験・経歴']],u:["check someone's credentials",'人の経歴・資格を確認する'],e:'he questioned my credentials',j:'彼は私の資格・経歴に疑問を呈した',i:'High value'},{w:'violation',p:'/ˌvaɪəˈleɪʃən/',m:'違反・侵害',d:'規則・法律に「違反すること」。権利やプライバシーを「侵害すること」にも使う。',learn:[['動','violate','違反する・侵害する'],['類','breach','違反・契約違反'],['関','rule','規則']],u:['in violation of ...','〜に違反して'],e:'in violation of the dress code',j:'服装規定に違反して',i:'High value'},{w:'gifted',p:'/ˈɡɪftɪd/',m:'才能に恵まれた',d:'特定の分野で、生まれつき非常に高い能力を持つこと。単なる good at より「天賦の才能」のニュアンスが強い。',learn:[['名','gift','才能・贈り物'],['類','talented','才能のある'],['関','gifted child','高い能力を持つ子ども']],u:['gifted in mathematics','数学の才能に恵まれた'],e:'remarkably gifted',j:'並外れて才能に恵まれた',i:'High value'},{w:'dimwitted',p:'/ˌdɪmˈwɪtɪd/',m:'頭の鈍い・愚かな',d:'人の理解力や判断力が低いことを表す、かなり否定的な形容詞。人に直接使うと侮辱的になり得る。',learn:[['名','wit','知力・機転'],['類','stupid','愚かな'],['類','slow-witted','頭の回転が遅い']],u:['a dimwitted remark','愚かな発言'],e:'dimwitted you are',j:'君は頭が鈍い',i:'Low frequency'},{w:'kinematics',p:'/ˌkɪnəˈmætɪks/',m:'運動学',d:'物体が「どう動くか」を、位置・速度・加速度などで記述する分野。運動を生む力そのものを扱う dynamics とは区別される。',learn:[['関','kinematic','運動学の'],['関','dynamics','力と運動を扱う力学'],['関','velocity','速度']],u:['kinematic analysis','運動学的分析'],e:'dimensional kinematics',j:'次元運動学',i:'Episode-specific'},{w:'remarkably',p:'/rɪˈmɑːrkəbli/',m:'著しく・驚くほど',d:'「注目に値するほど」「驚くほど」。very よりも、その程度が目立つ・印象的というニュアンスを加える。',learn:[['形','remarkable','注目すべき・驚くべき'],['類','notably','特に・著しく'],['類','exceptionally','並外れて']],u:['remarkably well','驚くほどうまく'],e:'remarkably gifted',j:'並外れて才能に恵まれた',i:'High value'},{w:'arranged',p:'/əˈreɪndʒd/',m:'手配された・整えられた',d:'arrange の過去形・過去分詞。予定や必要なものを「手配する」、物を「整えて配置する」の両方で使う。',learn:[['動','arrange','手配する・整える'],['名','arrangement','手配・取り決め・配置'],['類','organize','準備・整理する']],u:['arrange a meeting','会議を手配する'],e:'That can still be arranged.',j:'それならまだ手配できる',i:'High value'},{w:'business',p:'/ˈbɪznəs/',m:'用事・関心事・仕事',d:'「仕事・商売」だけでなく、「自分に関係すること／用事」という意味でも非常によく使う。None of your business. は定型表現。',learn:[['関','businessman','実業家'],['関','businesslike','事務的な・能率的な'],['類','affair','事柄・問題']],u:['None of your business.','あなたには関係ない'],e:'None of your business.',j:'あなたには関係ない',i:'Very useful'}];let idx=0,qidx=0,score=0,answered=0,studyWords=words,lastAnswerObj=null,detailIndex=0,currentWrong=[];let state=JSON.parse(localStorage.getItem('ys-state')||'{"learned":[],"wrong":[],"mastery":{}}');if(!state.wrong)state.wrong=[];if(!state.mastery)state.mastery={};let preferredVoice=null;function loadVoices(){let v=speechSynthesis.getVoices().filter(x=>/^en-US/i.test(x.lang));preferredVoice=v.find(x=>['Samantha','Ava','Zoe'].some(n=>x.name.includes(n)))||v[0]}if('speechSynthesis'in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}function speakText(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.96;if(preferredVoice)u.voice=preferredVoice;speechSynthesis.speak(u)}function save(){localStorage.setItem('ys-state',JSON.stringify(state));updateStats()}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.body.classList.toggle('quiz-mode',id==='quiz');document.body.classList.toggle('list-mode',id==='list'||id==='detail');document.body.classList.toggle('learn-mode',id==='learn');updateStats()}function currentLearnWord(){return studyWords[idx]}function startLearn(){studyWords=words;idx=0;show('learn');renderWord();speakText(studyWords[0].w)}function startWrongStudy(){studyWords=words.filter(x=>currentWrong.includes(x.w));if(!studyWords.length){alert('今回のテストで間違えた単語はありません');return}idx=0;show('learn');renderWord();speakText(studyWords[0].w)}function masteryOf(w){return state.mastery[w]||(state.wrong.includes(w)?'苦手':'未設定')}function relatedHTML(x){return x.learn.map(a=>'<div class="learn-row"><span class="tag">'+a[0]+'</span><b>'+a[1]+'</b>　'+a[2]+'</div>').join('')+'<div class="usage speakable" onclick="speakText(\''+x.u[0].replace(/'/g,"\\'")+'\')"><b>'+x.u[0]+'</b><span>'+x.u[1]+'</span></div>'}function renderLearnMastery(){let x=currentLearnWord(),ls=['苦手','うろ覚え','ほぼ覚えた','覚えた'],now=masteryOf(x.w);learnMastery.textContent=now;learnMastery.dataset.level=now;learnMasteryButtons.innerHTML=ls.map(l=>'<button class="'+(now===l?'active':'')+'" onclick="setLearnMastery(\''+l+'\')">'+l+'</button>').join('')}function setLearnMastery(l){let w=currentLearnWord().w;state.mastery[w]=l;if(l==='苦手'&&!state.wrong.includes(w))state.wrong.push(w);if(l!=='苦手')state.wrong=state.wrong.filter(v=>v!==w);save();renderLearnMastery()}function renderWord(){let x=currentLearnWord();counter.textContent=(idx+1)+' / '+studyWords.length;word.textContent=x.w;pron.textContent=x.p;meaning.textContent=x.m;learnDesc.textContent=x.d;learnRelated.innerHTML=relatedHTML(x);example.innerHTML='<div class="small">IN THE EPISODE</div><div class="example-text">'+x.e+'</div><div class="example-ja">'+x.j+'</div>';renderLearnMastery();if(!state.learned.includes(x.w)){state.learned.push(x.w);save()}nextBtn.textContent=idx===studyWords.length-1?(studyWords===words?'テストへ':'復習を終える'):'次へ'}function nextWord(){if(idx<studyWords.length-1){idx++;renderWord();window.scrollTo({top:0,behavior:'smooth'});speakText(studyWords[idx].w)}else{studyWords===words?startQuiz():show('review')}}function showList(){wordList.innerHTML=words.map((x,i)=>{let level=masteryOf(x.w);return '<div class="list-item" onclick="openDetail('+i+')"><div class="row"><span class="list-word">'+x.w+'</span><span class="mastery" data-level="'+level+'">'+level+'</span></div><div class="list-meaning">'+x.m+'　'+x.p+'</div></div>'}).join('');show('list')}function openDetail(i){detailIndex=i;let x=words[i];detailWord.textContent=x.w;detailPron.textContent=x.p;detailMeaning.textContent=x.m;detailDesc.textContent=x.d;detailLearn.innerHTML=relatedHTML(x);detailExample.innerHTML='<div class="small">IN THE EPISODE</div><div class="example-text">'+x.e+'</div><div class="example-ja">'+x.j+'</div>';renderMastery();show('detail');speakText(x.w)}function speakDetail(){speakText(words[detailIndex].w)}function speakDetailExample(){speakText(words[detailIndex].e)}function renderMastery(){let x=words[detailIndex],ls=['苦手','うろ覚え','ほぼ覚えた','覚えた'],now=masteryOf(x.w);detailMastery.textContent=now;detailMastery.dataset.level=now;masteryButtons.innerHTML=ls.map(l=>'<button class="'+(now===l?'active':'')+'" onclick="setMastery(\''+l+'\')">'+l+'</button>').join('')}function setMastery(l){let w=words[detailIndex].w;state.mastery[w]=l;if(l==='苦手'&&!state.wrong.includes(w))state.wrong.push(w);if(l!=='苦手')state.wrong=state.wrong.filter(v=>v!==w);save();renderMastery()}function promoteMastery(w){let now=masteryOf(w);if(now==='覚えた')return;state.mastery[w]=now==='ほぼ覚えた'?'覚えた':'ほぼ覚えた';state.wrong=state.wrong.filter(v=>v!==w)}function startQuiz(){qidx=0;score=0;answered=0;currentWrong=[];show('quiz');renderQuiz()}function renderQuiz(){let x=words[qidx];lastAnswerObj=null;quizCount.textContent=(qidx+1)+' / '+words.length;quizWord.textContent=x.w;answerNote.className='answer-note hidden';feedback.classList.add('hidden');quizNext.classList.add('hidden');let pool=[x.m];while(pool.length<4){let m=words[Math.floor(Math.random()*words.length)].m;if(!pool.includes(m))pool.push(m)}pool.sort(()=>Math.random()-.5);options.innerHTML='';pool.forEach(m=>{let b=document.createElement('button');b.className='option';b.textContent=m;b.onclick=()=>answer(b,m,x);options.appendChild(b)})}function showExplanation(s,type){lastAnswerObj=s;answerNote.className='answer-note '+type;answerNote.innerHTML='<div class="answer-word">'+s.w+'</div><div class="pron">'+s.p+'</div><div class="answer-detail"><b>'+s.m+'</b><br>'+s.d+'</div><div class="answer-related">'+s.learn.map(a=>'<div><span class="tag">'+a[0]+'</span><b>'+a[1]+'</b>　'+a[2]+'</div>').join('')+'</div>';speakText(s.w)}function speakAnswerWord(){if(lastAnswerObj)speakText(lastAnswerObj.w)}function answer(btn,m,x){if(m!==x.m){btn.classList.add('wrong');btn.disabled=true;let s=words.find(w=>w.m===m);if(s)showExplanation(s,'wrong');if(!currentWrong.includes(x.w))currentWrong.push(x.w);if(!state.wrong.includes(x.w))state.wrong.push(x.w);state.mastery[x.w]='苦手';save();return}answered++;score++;btn.classList.add('correct');promoteMastery(x.w);showExplanation(x,'correct');document.querySelectorAll('.option').forEach(b=>{b.disabled=false;b.onclick=()=>explainOption(b.textContent,x)});feedback.innerHTML='<div class="example-text">'+x.e+'</div><div class="example-ja">'+x.j+'</div>';feedback.classList.remove('hidden');quizNext.classList.remove('hidden');save()}function explainOption(m,current){let s=words.find(w=>w.m===m);if(s)showExplanation(s,s.w===current.w?'correct':'wrong')}function nextQuiz(){qidx<words.length-1?(qidx++,renderQuiz()):show('review')}function updateStats(){let n=state.learned.length;learnedStat.textContent=n;weakStat.textContent=state.wrong.length;homeProgress.style.width=(n/words.length*100)+'%';progressText.textContent=n+' / '+words.length+' words';correctStat.textContent=answered?Math.round(score/answered*100)+'%':'0%';studyWrongBtn.textContent='今回間違えた単語を STUDY（'+currentWrong.length+'）'}function resetData(){if(confirm('学習データをリセットしますか？')){state={learned:[],wrong:[],mastery:{}};currentWrong=[];save();show('home')}}updateStats();</script></body></html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Young Sheldon English</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--good:#166534;--bad:#991b1b}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:720px;margin:auto;padding:24px 16px 60px}.hero{padding:22px 4px 12px}.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700}
h1{font-size:30px;line-height:1.05;margin:8px 0}.sub{color:var(--muted);line-height:1.6}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:14px;box-shadow:0 8px 30px rgba(17,24,39,.04)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.pill{font-size:12px;background:#eef2f7;padding:7px 10px;border-radius:999px}
.progress{height:9px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:12px}.progress>div{height:100%;background:var(--accent);width:0}
button{width:100%;border:0;border-radius:15px;padding:14px 16px;font-size:16px;font-weight:700;background:var(--accent);color:white;margin-top:10px}
button.secondary{background:#eef2f7;color:var(--ink)}button.option{background:white;color:var(--ink);border:1px solid var(--line);text-align:left}
button.option.correct{border-color:var(--good);color:var(--good);background:#f0fdf4}button.option.wrong{border-color:var(--bad);color:var(--bad);background:#fef2f2}
.word{font-size:31px;font-weight:800;margin:8px 0}.pron{color:var(--muted);font-size:14px}.meaning{font-size:19px;font-weight:700;margin-top:12px}.example{padding:12px 14px;background:#f8fafc;border-radius:14px;margin-top:12px;line-height:1.5}
.small{font-size:13px;color:var(--muted)}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f8fafc;border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:20px}
nav{position:sticky;bottom:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:20px;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);padding:7px;border:1px solid var(--line);border-radius:18px}
nav button{margin:0;padding:11px 5px;font-size:13px}.screen{display:none}.screen.active{display:block}
</style>
</head>
<body><main>
<section class="hero"><div class="eyebrow">YOUNG SHELDON ENGLISH</div><h1>Watch less.<br>Remember more.</h1><div class="sub">視聴前に重要語彙 → ドラマ視聴 → 視聴後に思い出す。<br>まずは Season 1, Episode 1 用の試作版</div></section>

<section id="home" class="screen active">
 <div class="card">
  <div class="row"><div><b>Season 1 · Episode 1</b><div class="small">Pilot · Before Watching</div></div><span class="pill">v0.1</span></div>
  <div class="progress"><div id="homeProgress"></div></div>
  <p class="small" id="progressText">0 / 10 words</p>
  <button onclick="startLearn()">事前学習を始める</button>
 </div>
 <div class="card"><b>今日の状態</b><div class="stats" style="margin-top:12px">
  <div class="stat"><b id="learnedStat">0</b><span class="small">学習</span></div>
  <div class="stat"><b id="correctStat">0%</b><span class="small">正答率</span></div>
  <div class="stat"><b id="weakStat">0</b><span class="small">苦手</span></div>
 </div></div>
</section>

<section id="learn" class="screen">
 <div class="card">
  <div class="row"><span class="pill" id="counter"></span><span class="small" id="importance"></span></div>
  <div class="word" id="word"></div><div class="pron" id="pron"></div>
  <div id="reveal" class="hidden"><div class="meaning" id="meaning"></div><div class="example" id="example"></div><button class="secondary" onclick="speak()">発音を聞く</button></div>
  <button id="revealBtn" onclick="reveal()">意味を見る</button>
  <button id="nextBtn" class="hidden" onclick="nextWord()">次へ</button>
 </div>
</section>

<section id="quiz" class="screen">
 <div class="card"><div class="row"><b>Quick Test</b><span class="pill" id="quizCount"></span></div>
 <p class="small">意味を選択</p><div class="word" id="quizWord"></div><div id="options"></div><div id="feedback" class="example hidden"></div><button id="quizNext" class="hidden" onclick="nextQuiz()">次の問題</button></div>
</section>

<section id="review" class="screen">
 <div class="card"><b>After Watching</b><h2>視聴後レビュー</h2><p class="sub">ドラマを見終わったら、ここで視聴前に覚えた語彙をもう一度テスト。間違えた語彙を優先して復習</p><button onclick="startQuiz(true)">復習テストを開始</button><button class="secondary" onclick="resetData()">学習データをリセット</button></div>
</section>

<nav><button onclick="show('home')">HOME</button><button onclick="startQuiz(false)">TEST</button><button onclick="show('review')">REVIEW</button></nav>
</main>
<script>
const words=[
{w:"nourishment",p:"/ˈnɜːrɪʃmənt/",m:"栄養・滋養",e:"Children need proper nourishment.",i:"Useful"},
{w:"revolting",p:"/rɪˈvoʊltɪŋ/",m:"ひどく不快な・気持ち悪い",e:"That smell is revolting.",i:"Useful"},
{w:"credentials",p:"/krəˈdenʃəlz/",m:"資格・経歴・実績",e:"She has excellent credentials.",i:"High value"},
{w:"violation",p:"/ˌvaɪəˈleɪʃən/",m:"違反・侵害",e:"That is a violation of the rules.",i:"High value"},
{w:"gifted",p:"/ˈɡɪftɪd/",m:"才能に恵まれた",e:"He is a gifted student.",i:"High value"},
{w:"dimwitted",p:"/ˌdɪmˈwɪtɪd/",m:"頭の鈍い・愚かな",e:"Calling someone dimwitted is insulting.",i:"Low frequency"},
{w:"kinematics",p:"/ˌkɪnəˈmætɪks/",m:"運動学",e:"Kinematics describes motion.",i:"Episode-specific"},
{w:"remarkably",p:"/rɪˈmɑːrkəbli/",m:"著しく・驚くほど",e:"She learned remarkably quickly.",i:"High value"},
{w:"arranged",p:"/əˈreɪndʒd/",m:"手配された・整えられた",e:"Everything has been arranged.",i:"High value"},
{w:"business",p:"/ˈbɪznəs/",m:"用事・関心事・仕事",e:"Mind your own business.",i:"Very useful"}
];
let idx=0,qidx=0,score=0,answered=0,reviewMode=false;
let state=JSON.parse(localStorage.getItem("ys-state")||'{"learned":[],"wrong":[]}');
function save(){localStorage.setItem("ys-state",JSON.stringify(state));updateStats()}
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");updateStats()}
function startLearn(){idx=0;show("learn");renderWord()}
function renderWord(){let x=words[idx];counter.textContent=(idx+1)+" / "+words.length;importance.textContent=x.i;word.textContent=x.w;pron.textContent=x.p;meaning.textContent=x.m;example.innerHTML="<b>Example</b><br>"+x.e;reveal.classList.add("hidden");nextBtn.classList.add("hidden");revealBtn.classList.remove("hidden")}
function reveal(){reveal.classList.remove("hidden");revealBtn.classList.add("hidden");nextBtn.classList.remove("hidden");if(!state.learned.includes(words[idx].w))state.learned.push(words[idx].w);save()}
function nextWord(){if(idx<words.length-1){idx++;renderWord()}else startQuiz(false)}
function speak(){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(words[idx].w);u.lang="en-US";u.rate=.75;speechSynthesis.speak(u)}
function startQuiz(review){reviewMode=review;qidx=0;score=0;answered=0;show("quiz");renderQuiz()}
function renderQuiz(){let x=words[qidx];quizCount.textContent=(qidx+1)+" / "+words.length;quizWord.textContent=x.w;feedback.classList.add("hidden");quizNext.classList.add("hidden");let pool=[x.m];while(pool.length<4){let m=words[Math.floor(Math.random()*words.length)].m;if(!pool.includes(m))pool.push(m)}pool.sort(()=>Math.random()-.5);options.innerHTML="";pool.forEach(m=>{let b=document.createElement("button");b.className="option";b.textContent=m;b.onclick=()=>answer(b,m,x);options.appendChild(b)})}
function answer(btn,m,x){if(answered>qidx)return;answered++;document.querySelectorAll(".option").forEach(b=>b.disabled=true);if(m===x.m){btn.classList.add("correct");score++;state.wrong=state.wrong.filter(w=>w!==x.w);feedback.innerHTML="正解<br><b>"+x.e+"</b>"}else{btn.classList.add("wrong");document.querySelectorAll(".option").forEach(b=>{if(b.textContent===x.m)b.classList.add("correct")});if(!state.wrong.includes(x.w))state.wrong.push(x.w);feedback.innerHTML="正解：<b>"+x.m+"</b><br>"+x.e}feedback.classList.remove("hidden");quizNext.classList.remove("hidden");save()}
function nextQuiz(){if(qidx<words.length-1){qidx++;renderQuiz()}else{alert("Score: "+score+" / "+words.length);show("home")}}
function updateStats(){let n=state.learned.length;learnedStat.textContent=n;weakStat.textContent=state.wrong.length;homeProgress.style.width=(n/words.length*100)+"%";progressText.textContent=n+" / "+words.length+" words";correctStat.textContent=answered?Math.round(score/answered*100)+"%":"0%"}
function resetData(){if(confirm("学習データをリセットしますか？")){state={learned:[],wrong:[]};save();show("home")}}
updateStats();
</script></body></html>
